- name: "Config FZF"
  block:
    - name: "Ensure support dirs [FZF]"
      ansible.builtin.file:
        path: "{{ ansible_facts['env'].HOME }}/.config/zsh/autocomplete"
        state: directory
        mode: "0755"

    - name: "Create autocomplete for ZSH"
      ansible.builtin.shell: "set -o pipefail | fzf --zsh | sed \"s/\\\\^T/^F/\" > {{ ansible_facts['env'].HOME }}/.config/zsh/autocomplete/fzf.sh"
      changed_when: false
