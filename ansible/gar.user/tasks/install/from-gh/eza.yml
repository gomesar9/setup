- name: Check [Eza] installed and latest versions  # Refact: Dyn{name}
  block:
    - name: Check if [Eza] is installed
      ansible.builtin.stat:
        path: /usr/local/bin/eza
      register: eza_stat

    - name: Get [Eza] --version  # Refact: Dyn{name}
      ansible.builtin.shell: set -o pipefail && eza --version | grep -oP '^\K(v\d+\.\d+\.\d+)'  # Refact: Dyn{command}
      args:
        executable: /bin/bash
      changed_when: false
      register: eza_installed_version # Refact: Const generic
      when: eza_stat.stat.exists

    - name: Check latest if any installed
      ansible.builtin.shell: |
        set -o pipefail && curl -s -D- https://github.com/eza-community/eza/releases/latest |
        grep -oP 'location:.*/tag/\K(v\d+\.\d+\.\d+)'
      args:
        executable: /bin/bash
      register: eza_latest_version
      changed_when: false
      when: eza_installed_version is not skipped and eza_installed_version.rc == 0

    - name: Compare version
      ansible.builtin.debug:
        msg: "[Eza] present and up to date (Version {{ eza_latest_version.stdout }})."  # Refact: Dyn{name}
      when: eza_latest_version is not skipped and eza_installed_version.stdout == eza_latest_version.stdout

- name: Check for [Eza] updates  # Refact: Dyn{name}
  when: not(eza_latest_version is not skipped and eza_installed_version.stdout == eza_latest_version.stdout)
  block:
    - name: Create temporary directory
      ansible.builtin.file:
        path: /tmp/ansible-eza-install
        state: directory
        mode: "0755"
      register: tmp_dir

    - name: Download [Eza] archive
      ansible.builtin.get_url:
        url: https://github.com/eza-community/eza/releases/latest/download/eza_x86_64-unknown-linux-gnu.tar.gz
        dest: "{{ tmp_dir.path }}/eza_x86_64.tar.gz"
        validate_certs: false  # TODO: Checar certs
        mode: "0755"

    - name: Extract [Eza] archive
      ansible.builtin.unarchive:
        src: "{{ tmp_dir.path }}/eza_x86_64.tar.gz"
        dest: "{{ tmp_dir.path }}"
        remote_src: true

    - name: Install [Eza] executable
      ansible.builtin.command: "install -Dm 0755 {{ tmp_dir.path }}/eza /usr/local/bin/eza"
      changed_when: false
      become: true


- name: Ensure [Eza] symlinks
  block:
    - name: Ensure symbolic link for [Eza]
      ansible.builtin.file:
        src: /usr/local/bin/eza
        dest: /usr/bin/ls
        state: link
        force: true
      become: true

