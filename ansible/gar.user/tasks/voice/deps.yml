---
# Dependências de sistema da stack de voz (spec §7.1).
- name: "Voice deps | install system packages"
  ansible.builtin.apt:
    name:
      - cmake # build do whisper.cpp
      - build-essential # compiladores
      - ffmpeg # conversão/decodificação de áudio
      - xdotool # injeção de texto no X11 (spec §4)
      - python3-venv # venv do daemon
      - python3-pip
      - portaudio19-dev # backend do sounddevice (captura de mic)
      - alsa-utils # aplay (saída do Piper)
      - git
      - wget
    state: present
    update_cache: true
  become: true

# CUDA Toolkit (só quando voice_device=cuda). O driver NVIDIA é gerido pelo
# usuário; aqui instalamos só o toolkit (nvcc + libs) via repo apt oficial.
# Usamos o metapackage `cuda-toolkit-*` (driver-free) para não tocar no driver.
- name: "Voice deps | CUDA toolkit (gpu)"
  when: voice_device == "cuda"
  become: true
  block:
    - name: "CUDA | download NVIDIA repo keyring"
      ansible.builtin.get_url:
        url: "https://developer.download.nvidia.com/compute/cuda/repos/{{ cuda_repo_distro }}/x86_64/cuda-keyring_{{ cuda_keyring_version }}_all.deb"
        dest: "/tmp/cuda-keyring_{{ cuda_keyring_version }}_all.deb"
        mode: "0644"

    - name: "CUDA | install repo keyring (adds apt source + key)"
      ansible.builtin.apt:
        deb: "/tmp/cuda-keyring_{{ cuda_keyring_version }}_all.deb"

    - name: "CUDA | install {{ cuda_toolkit_package }}"
      ansible.builtin.apt:
        name: "{{ cuda_toolkit_package }}"
        state: present
        update_cache: true

    - name: "CUDA | ensure /usr/local/cuda symlink -> newest toolkit"
      ansible.builtin.shell:
        cmd: 'ln -sfn "$(ls -d /usr/local/cuda-* | sort -V | tail -1)" /usr/local/cuda'
      changed_when: false
