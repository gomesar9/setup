---
# venv Python + daemon de ditado + serviço systemd --user (spec §7.3).
- name: "Daemon | create virtualenv"
  ansible.builtin.command:
    cmd: "python3 -m venv {{ voice_venv }}"
    creates: "{{ voice_venv }}/bin/python"

- name: "Daemon | ensure pip tooling"
  ansible.builtin.pip:
    name: ["pip", "wheel", "setuptools"]
    state: present
    virtualenv: "{{ voice_venv }}"

# torch + torchaudio são dependências do silero-vad. O wheel default do PyPI é
# a build CUDA (enorme) e falha/OOM em máquina CPU. Instalamos os dois do índice
# CPU juntos; assim o silero-vad não rebaixa/reinstala torchaudio do PyPI (o que
# quebraria a ABI do _torchaudio.so) e a task fica idempotente.
# Para GPU (RTX 5070): defina voice_device=cuda e instale os wheels CUDA à mão
# (ver README), ex.: pip install torch torchaudio --index-url .../whl/cu124
- name: "Daemon | install torch + torchaudio (CPU wheels)"
  ansible.builtin.pip:
    name:
      - "torch=={{ torch_version }}"
      - "torchaudio=={{ torch_version }}"
    state: present
    virtualenv: "{{ voice_venv }}"
    # index pytorch p/ os wheels +cpu; extra pypi resolve deps puras (ex.
    # typing-extensions), que o índice pytorch serve com metadata inconsistente.
    extra_args: "--index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple"
  when: voice_device == "cpu"

- name: "Daemon | install python deps"
  ansible.builtin.pip:
    name:
      - silero-vad # VAD (segmentação de fala)
      - sounddevice # captura de áudio do mic
      - numpy
      - requests # cliente HTTP p/ Ollama
    state: present
    virtualenv: "{{ voice_venv }}"

- name: "Daemon | install dispatcher + toggle scripts"
  ansible.builtin.copy:
    src: "home/user/local/bin/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
    mode: "0755"
  loop:
    - voice-dispatcher.py
    - voice-toggle

- name: "Daemon | ensure systemd user dir"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user"
    state: directory
    mode: "0755"

- name: "Daemon | install systemd --user unit"
  ansible.builtin.template:
    src: "home/user/.config/systemd/user/voice-dictation.service.j2"
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/voice-dictation.service"
    mode: "0644"
  register: voice_unit

# Em container/CI não há bus de usuário; só mexe no systemd se houver.
- name: "Daemon | detect user systemd bus"
  ansible.builtin.stat:
    path: "{{ ansible_env.XDG_RUNTIME_DIR | default('/run/user/' + (ansible_facts['user_uid'] | string)) }}/bus"
  register: user_dbus
  changed_when: false

- name: "Daemon | enable + (re)start service"
  ansible.builtin.systemd:
    name: voice-dictation.service
    scope: user
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if voice_unit is changed else 'started' }}"
  when: user_dbus.stat.exists
