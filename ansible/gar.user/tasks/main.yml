---
# Convenção de tags: ver CLAUDE.md ("Convenção de tags").
# 3 eixos por task: componente (nome do tool) + ação (install/config/userconfig)
# + grupo opcional (langs/iac). include_tasks leva SEMPRE o par `apply:` + diretiva.

# --- Estrutura base de diretórios ---
- name: Create user base directories
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "700"
  loop:
    - .local/
    - code
  tags: [userconfig]

- name: Create nvim cache directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env'].HOME }}/.cache/nvim/undodir"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "700"
  tags: [nvim, userconfig]

# --- Dotfiles (copiados por componente para que a tag do tool arraste sua config) ---
- name: Copy nvim dotfiles
  ansible.builtin.copy:
    src: home/user/config/nvim
    dest: "{{ ansible_facts['env'].HOME }}/.config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [nvim, userconfig]

- name: Copy eza dotfiles
  ansible.builtin.copy:
    src: home/user/config/eza
    dest: "{{ ansible_facts['env'].HOME }}/.config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [eza, userconfig]

- name: Copy zsh dotfiles
  ansible.builtin.copy:
    src: "home/user/{{ item['src'] }}"
    dest: "{{ ansible_facts['env'].HOME }}/{{ item['dest'] }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  loop:
    - { src: config/zsh, dest: .config }
    - { src: rcfiles/gomesrc.sh, dest: .gomesrc }
    - { src: rcfiles/zshrc.sh, dest: .zshrc }
  tags: [zsh, userconfig]

- name: Copy bash dotfiles
  ansible.builtin.copy:
    src: home/user/config/bash
    dest: "{{ ansible_facts['env'].HOME }}/.config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [bash, userconfig]

- name: Copy git dotfiles
  ansible.builtin.copy:
    src: home/user/config/git
    dest: "{{ ansible_facts['env'].HOME }}/.config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [git, userconfig]

- name: Copy npm dotfiles
  ansible.builtin.copy:
    src: home/user/config/npm
    dest: "{{ ansible_facts['env'].HOME }}/.config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [nvm, userconfig]

- name: Copy python dotfiles
  ansible.builtin.copy:
    src: home/user/config/python
    dest: "{{ ansible_facts['env'].HOME }}/.config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [pyenv, userconfig]

- name: Copy fontconfig dotfiles
  ansible.builtin.copy:
    src: home/user/config/fontconfig
    dest: "{{ ansible_facts['env'].HOME }}/.config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [nerdfonts, userconfig]

- name: Copy autostart dotfiles
  ansible.builtin.copy:
    src: home/user/config/autostart
    dest: "{{ ansible_facts['env'].HOME }}/.config"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [autostart, userconfig]

- name: Copy guake wallpapers
  ansible.builtin.copy:
    src: home/user/config/guake/wallpapers
    dest: "{{ ansible_facts['env'].HOME }}/.config/guake"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  tags: [guake, userconfig]

- name: Copy scripts
  ansible.builtin.copy:
    src: home/user/local/bin
    dest: "{{ ansible_facts['env'].HOME }}/.local"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "700"
    directory_mode: "700"
  tags: [userconfig]

- name: Render guake.conf
  ansible.builtin.template:
    src: home/user/config/guake/guake.conf.j2
    dest: "{{ ansible_facts['env'].HOME }}/.config/guake/guake.conf"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
  tags: [guake, userconfig]

# Instalação de ferramentas padrão
- name: Include basic system tools
  ansible.builtin.include_tasks:
    file: install/apt/default.yml
    apply:
      tags: [apt, install]
  tags: [apt, install]

# Instalação do essencial: Neovim
- name: Include Neovim install
  ansible.builtin.include_tasks:
    file: install/from-gh/install_release.yml
    apply:
      tags: [nvim, install]
  vars:
    gh_tool_name: Neovim
    # gh_tool_desired_version: v0.10.4
    gh_tool_repo: https://github.com/neovim/neovim
    gh_tool_version_command: nvim --version | grep -oP 'NVIM \K(v\d+\.\d+\.\d+)'
    gh_tool_final_path: /usr/local/bin/nvim
    gh_tool_download_file_name: nvim-linux-x86_64.tar.gz
    gh_tool_extracted_rel_file_path: nvim-linux-x86_64/bin/nvim
    gh_tool_symlink_path: /usr/bin/vim
    support_files:
      - {
          src: "nvim-linux-x86_64/share/applications/",
          dest: "/usr/share/applications/",
        }
      - { src: "nvim-linux-x86_64/share/icons/", dest: "/usr/share/icons/" }
      - { src: "nvim-linux-x86_64/share/man/", dest: "/usr/share/man/" }
      - { src: "nvim-linux-x86_64/share/nvim/", dest: "/usr/local/share/nvim/" }
      - { src: "nvim-linux-x86_64/lib/nvim/", dest: "/usr/local/lib/" }
  tags: [nvim, install]

# Instalação de outras ferramentas via Github
- name: Include Eza install
  ansible.builtin.include_tasks:
    file: install/from-gh/install_release.yml
    apply:
      tags: [eza, install]
  vars:
    gh_tool_name: Eza
    gh_tool_repo: https://github.com/eza-community/eza
    gh_tool_version_command: eza --version | grep -oP '^v\d+\.\d+\.\d+'
    gh_tool_final_path: /usr/local/bin/eza
    gh_tool_download_file_name: eza_x86_64-unknown-linux-gnu.tar.gz
    gh_tool_extracted_rel_file_path: eza
    # gh_tool_symlink_path: /usr/bin/ls
  tags: [eza, install]

- name: Config Eza
  ansible.builtin.include_tasks:
    file: config/eza.yml
    apply:
      tags: [eza, config]
  vars:
    eza_theme: rose-pine
  tags: [eza, config]

- name: Install Fuzzy Finder
  ansible.builtin.include_tasks:
    file: install/from-gh/install_release.yml
    apply:
      tags: [fzf, install]
  vars:
    gh_tool_name: Fuzzy Finder
    gh_tool_repo: https://github.com/junegunn/fzf
    gh_tool_version_command: fzf --version | grep -oP '^\d+\.\d+\.\d+'
    gh_tool_final_path: /usr/local/bin/fzf
    gh_tool_url_version_command: grep -oP 'location:.*/tag/v?\K(\d+\.\d+\.\d+)'
    gh_tool_url_version: v${VERSION}
    gh_tool_download_file_name: fzf-${VERSION}-linux_amd64.tar.gz
    gh_tool_extracted_rel_file_path: fzf
  tags: [fzf, install]

- name: Config FZF
  ansible.builtin.include_tasks:
    file: config/fzf.yml
    apply:
      tags: [fzf, config]
  tags: [fzf, config]

- name: Install FdFind
  ansible.builtin.include_tasks:
    file: install/from-gh/install_release.yml
    apply:
      tags: [fd, install]
  vars:
    gh_tool_name: FdFind
    gh_tool_repo: https://github.com/sharkdp/fd
    gh_tool_version_command: echo -n "v$(fd --version | grep -oP '^fd\s\K(\d+\.\d+\.\d+)')"
    gh_tool_final_path: /usr/local/bin/fd
    gh_tool_download_file_name: fd-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
    gh_tool_extracted_rel_file_path: fd
    gh_tool_unarchive_options:
      - "--strip-components=1"
  tags: [fd, install]

