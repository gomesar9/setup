# Stack de ditado por voz local (spec: plans/voice-dev-stack-spec.md)
# Self-contained: rode via `--tags voice`. Não entra no `--tags install` global
# (stack pesada). O `apply:` propaga `voice` a todas as sub-tasks; cada sub-include
# de voice/main.yml declara suas próprias tags de ação/subcomponente.
- name: Voice-to-code dictation stack
  ansible.builtin.include_tasks:
    file: voice/main.yml
    apply:
      tags: [voice]
  tags: [voice]

- name: Config Flameshot screenshot shortcuts (Cinnamon)
  ansible.builtin.include_tasks:
    file: config/flameshot.yml
    apply:
      tags: [flameshot, config]
  vars:
    flameshot_save_dir: "{{ ansible_facts['env'].HOME }}/Pictures/Screenshots"
  tags: [flameshot, config]

- name: User config
  user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
  become: true
  tags: [zsh, userconfig]
