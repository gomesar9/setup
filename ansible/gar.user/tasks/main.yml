---
- name: Create default directory structure
  ansible.builtin.file:
    path: "/home/{{ ansible_facts['user_id'] }}/{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "700"
  loop:
    - .cache/nvim/undodir
    - .local/
    - code

- name: Copy dotfiles
  ansible.builtin.copy:
    src: "home/user/{{ item['src'] }}"
    dest: "/home/{{ item['dest'] }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "600"
    directory_mode: "700"
  loop:
    - { src: config/autostart, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/bash, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/fontconfig, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/git, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/guake, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/npm, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/nvim, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/eza, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/python, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: config/zsh, dest: "{{ ansible_facts['user_id'] }}/.config" }
    - { src: rcfiles/gomesrc.sh, dest: "{{ ansible_facts['user_id'] }}/.gomesrc" }
    - { src: rcfiles/zshrc.sh, dest: "{{ ansible_facts['user_id'] }}/.zshrc" }

- name: Copy scripts
  ansible.builtin.copy:
    src: home/user/local/bin
    dest: "/home/{{ ansible_facts['user_id'] }}/.local"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: "700"
    directory_mode: "700"

# Instalação de ferramentas padrão
- name: Include basic system tools
  include_tasks: install/apt/default.yml

# Instalação do essencial: Neovim
- name: Include Neovim install
  include_tasks: install/from-gh/install_release.yml
  vars:
    gh_tool_name: Neovim
    # gh_tool_desired_version: v0.10.4
    gh_tool_repo: https://github.com/neovim/neovim
    gh_tool_version_command: nvim --version | grep -oP 'NVIM \K(v\d+\.\d+\.\d+)'
    gh_tool_final_path: /usr/local/bin/nvim
    gh_tool_download_file_name: nvim-linux-x86_64.tar.gz
    gh_tool_extracted_rel_file_path: nvim-linux-x86_64/bin/nvim
    gh_tool_symlink_path: /usr/bin/vim
    support_files:
      - {
          src: "nvim-linux-x86_64/share/applications/",
          dest: "/usr/share/applications/",
        }
      - { src: "nvim-linux-x86_64/share/icons/", dest: "/usr/share/icons/" }
      - { src: "nvim-linux-x86_64/share/man/", dest: "/usr/share/man/" }
      - { src: "nvim-linux-x86_64/share/nvim/", dest: "/usr/local/share/nvim/" }
      - { src: "nvim-linux-x86_64/lib/nvim/", dest: "/usr/local/lib/" }

# Instalação de outras ferramentas via Github
- name: Include Eza install
  include_tasks: install/from-gh/install_release.yml
  vars:
    gh_tool_name: Eza
    gh_tool_repo: https://github.com/eza-community/eza
    gh_tool_version_command: eza --version | grep -oP '^v\d+\.\d+\.\d+'
    gh_tool_final_path: /usr/local/bin/eza
    gh_tool_download_file_name: eza_x86_64-unknown-linux-gnu.tar.gz
    gh_tool_extracted_rel_file_path: eza
    # gh_tool_symlink_path: /usr/bin/ls

- name: Config Eza
  include_tasks: config/eza.yml
  vars:
    eza_theme: rose-pine

- name: Install Fuzzy Finder
  include_tasks: install/from-gh/install_release.yml
  vars:
    gh_tool_name: Fuzzy Finder
    gh_tool_repo: https://github.com/junegunn/fzf
    gh_tool_version_command: fzf --version | grep -oP '^\d+\.\d+\.\d+'
    gh_tool_final_path: /usr/local/bin/fzf
    gh_tool_url_version_command: grep -oP 'location:.*/tag/v?\K(\d+\.\d+\.\d+)'
    gh_tool_url_version: v${VERSION}
    gh_tool_download_file_name: fzf-${VERSION}-linux_amd64.tar.gz
    gh_tool_extracted_rel_file_path: fzf

- name: Config FZF
  include_tasks: config/fzf.yml

- name: Install FdFind
  include_tasks: install/from-gh/install_release.yml
  vars:
    gh_tool_name: FdFind
    gh_tool_repo: https://github.com/sharkdp/fd
    gh_tool_version_command: echo -n "v$(fd --version | grep -oP '^fd\s\K(\d+\.\d+\.\d+)')"
    gh_tool_final_path: /usr/local/bin/fd
    gh_tool_download_file_name: fd-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
    gh_tool_extracted_rel_file_path: fd
    gh_tool_unarchive_options:
      - "--strip-components=1"

# Instalações únicas
- name: Install kubectl
  include_tasks: install/kubectl.yml

- name: Install Terraform
  include_tasks:
    file: install/terraform.yml
    apply:
      tags: [iac, install]
  tags: [iac, install]

- name: Install Luarocks
  include_tasks: install/luarocks.yml
  vars:
    luarocks_stable_version: "3.11.1"

- name: Install Pyenv
  include_tasks: install/pyenv.yml

- name: Config Pyenv
  include_tasks: config/pyenv.yml

- name: Install NVM
  include_tasks: install/nvm.yml

- name: Config NVM
  include_tasks: config/nvm.yml

- name: Install oh-my-zsh
  include_tasks: install/ohmyzsh.yml

- name: Install Golang
  include_tasks: install/go.yml

- name: Install Discord
  include_tasks: install/discord.yml

- name: Install Lens
  include_tasks: install/lens.yml

- name: Install Nerd Fonts
  include_tasks: install/nerdfonts.yml

# Stack de ditado por voz local (spec: plans/voice-dev-stack-spec.md)
- name: Voice-to-code dictation stack
  include_tasks: voice/main.yml
  tags: [voice, ollama-install]

- name: User config
  user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
  become: true
