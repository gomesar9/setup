---
# Orquestrador da stack de ditado por voz local.
# Incluído por tasks/main.yml. Rode isolado com: ansync --tags voice
#
# NOTA: include_tasks NÃO propaga as tags da diretiva para as tasks incluídas.
# Por isso usamos `apply: tags:` em cada include, senão sob `--tags voice` os
# includes rodariam mas as tasks internas (sem tag) seriam puladas.
- name: "Voice | load variables"
  ansible.builtin.include_vars: "{{ role_path }}/vars/voice.yml"
  tags: [voice]

- name: "Voice | ensure base directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    - "{{ voice_cfg_dir }}"
    - "{{ voice_data_dir }}"
    - "{{ whisper_model_dir }}"
    - "{{ piper_dir }}"
  tags: [voice]

- name: "Voice | system dependencies (apt)"
  ansible.builtin.include_tasks:
    file: deps.yml
    apply:
      tags: [voice, install, apt]
  tags: [voice, install, apt]

- name: "Voice | build whisper.cpp"
  ansible.builtin.include_tasks:
    file: whisper-cpp.yml
    apply:
      tags: [voice, install, whisper]
  tags: [voice, install, whisper]

- name: "Voice | download Whisper model"
  ansible.builtin.include_tasks:
    file: model.yml
    apply:
      tags: [voice, model]
  tags: [voice, model]

- name: "Voice | custom vocabulary (initial_prompt)"
  ansible.builtin.include_tasks:
    file: vocab.yml
    apply:
      tags: [voice, vocab]
  tags: [voice, vocab]

- name: "Voice | install Ollama + systemd service"
  ansible.builtin.include_tasks:
    file: ollama-install.yml
    apply:
      tags: [voice, ollama, install]
  tags: [voice, ollama, install]

- name: "Voice | Ollama refinement model + prompt"
  ansible.builtin.include_tasks:
    file: ollama.yml
    apply:
      tags: [voice, ollama]
  tags: [voice, ollama]

- name: "Voice | Python venv + dictation daemon"
  ansible.builtin.include_tasks:
    file: daemon.yml
    apply:
      tags: [voice, daemon]
  tags: [voice, daemon]

- name: "Voice | Piper TTS"
  ansible.builtin.include_tasks:
    file: piper.yml
    apply:
      tags: [voice, install, tts]
  tags: [voice, install, tts]

- name: "Voice | Claude Code TTS hook"
  ansible.builtin.include_tasks:
    file: claude-hook.yml
    apply:
      tags: [voice, hook]
  tags: [voice, hook]

- name: "Voice | Cinnamon global hotkey"
  ansible.builtin.include_tasks:
    file: hotkey.yml
    apply:
      tags: [voice, hotkey]
  tags: [voice, hotkey]
