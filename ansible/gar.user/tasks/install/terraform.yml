- name: "Install Terraform"
  block:
    - name: "Get terraform local version"
      ansible.builtin.shell: |
        terraform version | grep -oP 'Terraform v\K(\d+\.\d+\.\d+)' || echo ''
      register: local_version
      ignore_errors: true
      changed_when: false

    - name: "Get terraform latest version"
      ansible.builtin.uri:
        url: https://checkpoint-api.hashicorp.com/v1/check/terraform
        return_content: true
        validate_certs: true
      register: tf_checkpoint
      changed_when: false

    - name: "Set terraform_desired_version"
      ansible.builtin.set_fact:
        terraform_desired_version: "{{ tf_checkpoint.json.current_version }}"
      when: terraform_desired_version is not defined

    - name: Display versions
      ansible.builtin.debug:
        msg: "Latest terraform: {{ terraform_desired_version }}. Local: {{ local_version.stdout | default('None') }}"

- name: "Install/Update terraform"
  when: local_version.stdout != terraform_desired_version
  block:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
        suffix: .terraform
      register: tmp_dir

    - name: "Download terraform zip"
      ansible.builtin.get_url:
        url: "https://releases.hashicorp.com/terraform/{{ terraform_desired_version }}/terraform_{{ terraform_desired_version }}_linux_amd64.zip"
        dest: "{{ tmp_dir.path }}/terraform.zip"
        mode: "0644"
        validate_certs: true

    - name: "Extract terraform"
      ansible.builtin.unarchive:
        src: "{{ tmp_dir.path }}/terraform.zip"
        dest: "{{ tmp_dir.path }}"
        remote_src: true

    - name: "Install terraform binary"
      ansible.builtin.command: "install -Dm 0755 {{ tmp_dir.path }}/terraform /usr/local/bin/terraform"
      changed_when: false
      become: true

    - name: "Cleanup temp dir"
      ansible.builtin.file:
        path: "{{ tmp_dir.path }}"
        state: absent
      when: tmp_dir is not skipped
