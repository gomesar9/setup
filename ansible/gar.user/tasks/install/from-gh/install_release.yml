- name: "Check installed and latest versions [{{ gh_tool_name }}]"
  block:
    - name: "Check if installed [{{ gh_tool_name }}]"
      ansible.builtin.stat:
        path: /usr/local/bin/eza
      register: ght_stat

    - name: "Get version [{{ gh_tool_name }}]"
      ansible.builtin.shell: set -o pipefail && {{ gh_tool_version_command }}
      args:
        executable: /bin/bash
      changed_when: false
      register: ght_installed_version
      when: ght_stat.stat.exists

    - name: "Definir valor padrão para gh_tool_version_regex [{{ gh_tool_name }}]"
      ansible.builtin.set_fact:
        gh_tool_version_regex: "grep -oP 'location:.*/tag/\\K(v?\\d+\\.\\d+\\.\\d+)'"
      when: gh_tool_version_regex is not defined

    - name: "Check latest if any installed [{{ gh_tool_name }}]"
      ansible.builtin.shell: |
        set -o pipefail && curl -s -D- {{ gh_tool_repo }}/releases/latest |
        {{ gh_tool_version_regex }}
      args:
        executable: /bin/bash
      register: ght_latest_version
      changed_when: false
      when: ght_installed_version is not skipped and ght_installed_version.rc == 0

    - name: "Compare versions [{{ gh_tool_name }}]"
      ansible.builtin.debug:
        msg: "{{ gh_tool_name }} present and up to date (Version {{ ght_latest_version.stdout }})."
      when: ght_latest_version is not skipped and ght_installed_version.stdout == ght_latest_version.stdout

- name: "Check for updates [{{ gh_tool_name }}]"
  when: not(ght_latest_version is not skipped and ght_installed_version.stdout == ght_latest_version.stdout)
  block:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
        suffix: .gh_tool
      register: tmp_dir

    - name: "Download  archive [{{ gh_tool_name }}]"
      ansible.builtin.get_url:
        url: "{{ gh_tool_repo }}/releases/latest/download/{{ gh_tool_download_file_name }}"
        dest: "{{ tmp_dir.path }}/gh_tool.tar.gz"
        validate_certs: false  # TODO: Checar certs
        mode: "0755"

    - name: "Extract archive [{{ gh_tool_name }}]"
      ansible.builtin.unarchive:
        src: "{{ tmp_dir.path }}/gh_tool.tar.gz"
        dest: "{{ tmp_dir.path }}"
        remote_src: true

    - name: "Install executable [{{ gh_tool_name }}]"
      ansible.builtin.command: "install -Dm 0755 {{ tmp_dir.path }}/{{ gh_tool_extracted_rel_file_path }} {{ gh_tool_final_path }}"
      changed_when: false
      become: true

    - name: "Ensure support dirs [{{ gh_tool_name }}]"
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: directory
        mode: "{{ item.mode | default('0755') }}" # Valor padrão para mode
      loop: "{{ support_files }}"
      loop_control:
        label: "{{ item.dest }}"
      become: true
      when: support_files is defined

    - name: "Copy support files [{{ gh_tool_name }}]"
      ansible.builtin.copy:
        src: "{{ tmp_dir.path }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}" # Valor padrão para mode
        remote_src: true
      loop: "{{ support_files }}"
      loop_control:
        label: "{{ item.src }} -> {{ item.dest }}"
      become: true
      when: support_files is defined

- name: "Ensure symbolic links [{{ gh_tool_name }}]"
  block:
    - name: "Ensure symbolic link for [{{ gh_tool_name }}]"
      ansible.builtin.file:
        src: "{{ gh_tool_final_path }}"
        dest: "{{ gh_tool_symlink_path }}"
        state: link
        force: true
      become: true
      when: gh_tool_symlink_path is defined
