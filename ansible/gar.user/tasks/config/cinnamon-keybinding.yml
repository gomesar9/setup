---
# Reutilizável: registra um custom keybinding do Cinnamon e faz MERGE no
# custom-list (não sobrescreve outros slots). O caller garante dbus+cinnamon.
# Vars esperadas: ckb_slot, ckb_name, ckb_command, ckb_binding (string GVariant, ex. "['Print']").
- name: "Cinnamon kb | set fields ({{ ckb_slot }})"
  ansible.builtin.shell: |
    set -eu
    base=/org/cinnamon/desktop/keybindings/custom-keybindings/{{ ckb_slot }}
    changed=0
    write_if_diff() {
      cur=$(dconf read "$1" 2>/dev/null || true)
      if [ "$cur" != "$2" ]; then
        dconf write "$1" "$2"
        changed=1
      fi
    }
    write_if_diff "$base/name" "'{{ ckb_name }}'"
    write_if_diff "$base/command" "'{{ ckb_command }}'"
    write_if_diff "$base/binding" "{{ ckb_binding }}"
    [ "$changed" = "1" ] && echo CHANGED || true
  register: ckb_fields
  changed_when: "'CHANGED' in ckb_fields.stdout"

- name: "Cinnamon kb | merge {{ ckb_slot }} into custom-list"
  ansible.builtin.shell: |
    set -eu
    cur=$(dconf read /org/cinnamon/desktop/keybindings/custom-list 2>/dev/null || true)
    new=$(SLOT="{{ ckb_slot }}" python3 - "$cur" <<'PY'
    import os, sys, ast
    cur = (sys.argv[1] or "").strip()
    try:
        lst = ast.literal_eval(cur) if cur and cur != "@as []" else []
        if not isinstance(lst, list):
            lst = []
    except Exception:
        lst = []
    slot = os.environ["SLOT"]
    if slot not in lst:
        lst.append(slot)
    print("[" + ", ".join("'%s'" % s for s in lst) + "]")
    PY
    )
    if [ "$cur" != "$new" ]; then
      dconf write /org/cinnamon/desktop/keybindings/custom-list "$new"
      echo CHANGED
    fi
  register: ckb_list
  changed_when: "'CHANGED' in ckb_list.stdout"
